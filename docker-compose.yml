version: "3.9"

# ─── ShopSphere — Docker Compose ─────────────────────────────────────────────
#
# Starts:
#   postgres  — PostgreSQL database
#   backend   — FastAPI application
#   frontend  — React app served by Nginx
#
# Usage:
#   docker compose up --build
#   docker compose down -v   (removes volumes too)
#
# To run with failure simulation enabled:
#   ENABLE_FAILURE_SIMULATION=true docker compose up --build

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopsphere_user
      POSTGRES_PASSWORD: shopsphere_pass
      POSTGRES_DB: shopsphere_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere_user -d shopsphere_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shopsphere-net

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://shopsphere_user:shopsphere_pass@postgres:5432/shopsphere_db
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-this-in-production-min-32}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://frontend:80
      SERVICE_NAME: shopsphere
      SERVICE_VERSION: "1.0.0"
      ENABLE_METRICS: "true"
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shopsphere-net

  # ─── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: shopsphere-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - shopsphere-net

volumes:
  postgres_data:
    driver: local

networks:
  shopsphere-net:
    driver: bridge
